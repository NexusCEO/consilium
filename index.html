<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Consilium</title>
  <meta name="description" content="Agenda, répertoire de contacts par domaine et planification d’objectifs.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101826" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="icons/icon.svg" alt="" width="32" height="32"><span>Consilium</span></div>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#/agenda" data-route="agenda">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Agenda</span></a>
        <a href="#/contacts" data-route="contacts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/></svg>
          <span>Contacts</span></a>
        <a href="#/objectifs" data-route="objectifs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>
          <span>Objectifs</span></a>
        <a href="#/donnees" data-route="donnees">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
          <span>Données</span></a>
      </nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <dialog id="modal" class="modal" closedby="any" aria-labelledby="modal-title"></dialog>
  <div class="toast-region" role="region" aria-label="Notifications">
    <div id="toast" class="toast" popover="manual">
      <span class="toast-text"></span>
      <button type="button" class="icon-btn" popovertarget="toast" popovertargetaction="hide" aria-label="Fermer la notification">×</button>
    </div>
  </div>
  <p class="visually-hidden">Annonces pour lecteur d’écran</p>
  <div id="announcer" class="visually-hidden" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
